name: Eval regression

on:
  pull_request:
    paths:
      - "eval/**"
      - "agents/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "agents/**"
      - ".github/workflows/eval.yml"

jobs:
  validate-golden-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate golden_set.jsonl
        run: python3 eval/scripts/validate-golden-set.py --min-rows 50

