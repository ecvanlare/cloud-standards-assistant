name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      source_acr:
        description: Registry to import the image from; empty builds it
        type: string
        default: ""
    outputs:
      acr_name:
        value: ${{ jobs.deploy.outputs.acr_name }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      acr_name: ${{ steps.image.outputs.acr_name }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_operator_object_ids: ${{ secrets.OPERATOR_OBJECT_IDS }}
      TF_VAR_serving_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_DIR: terraform/envs/${{ inputs.environment }}
      ENV: ${{ inputs.environment }}
      IMAGE: csa-serving:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m venv .venv && .venv/bin/pip install --quiet -r scripts/requirements.txt

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Mask operator IDs
        run: jq -r '.[] | "::add-mask::\(.)"' <<<"$TF_VAR_operator_object_ids"

      - run: terraform -chdir="$TF_DIR" init -backend-config=backend.hcl
      - name: Container registry
        run: terraform -chdir="$TF_DIR" apply -auto-approve -target=module.acr

      - name: Serving image
        id: image
        env:
          SOURCE_ACR: ${{ inputs.source_acr }}
        run: |
          acr="$(terraform -chdir="$TF_DIR" output -raw acr_name)"
          echo "acr_name=${acr}" >> "$GITHUB_OUTPUT"
          if az acr repository show --name "$acr" --image "$IMAGE" --only-show-errors >/dev/null 2>&1; then
            echo "${IMAGE} already in ${acr}"
          elif [[ -z "$SOURCE_ACR" ]]; then
            az acr build --registry "$acr" --image "$IMAGE" --file serving/Dockerfile serving
          else
            source_id="$(az acr show --name "$SOURCE_ACR" --query id -o tsv)"
            az acr import --name "$acr" --source "$IMAGE" --registry "$source_id"
          fi

      - name: Plan (addresses only)
        run: |
          terraform -chdir="$TF_DIR" plan -out=tfplan >/dev/null
          terraform -chdir="$TF_DIR" show -json tfplan \
            | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join("/")) \(.address)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply
        run: terraform -chdir="$TF_DIR" apply tfplan
      - name: Export outputs
        run: scripts/tf-env.sh "$ENV" >> "$GITHUB_ENV"

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: tools/functions/asb_version
          remote-build: true
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.REGISTRY_FUNCTION_APP_NAME }}
          package: tools/functions/terraform_registry
          remote-build: true

      # GitHub's OIDC token is valid for 5 minutes and az cannot refresh it, so sign in again after long steps.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Search corpus
        run: search/scripts/publish.sh all

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Agent version
        run: .venv/bin/python agents/scripts/deploy_agent.py
      - name: Smoke
        run: make smoke ENV="$ENV"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Eval gate
        run: make eval ENV="$ENV"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-${{ inputs.environment }}-${{ github.sha }}
          path: |
            eval/results/foundry-eval-latest.json
            agents/.last-deploy.json
          if-no-files-found: ignore
